name: macOS

on:
  push:
    branches: [main, develop-cross-platform, develop-perf-3.2.0, develop-openeb-3.2.0]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: Build Apple Silicon app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # The secrets context is not available in step-level "if" expressions
      # (it invalidates the whole workflow), so it is surfaced to this step
      # through step-level env — which is the sanctioned place for it — and
      # the guard reads the env context instead.
      - name: Check out SilkyEvCam HAL plugin sources (optional)
        id: silky
        if: env.EBPLUS_CI_TOKEN != ''
        continue-on-error: true
        env:
          EBPLUS_CI_TOKEN: ${{ secrets.EBPLUS_CI_TOKEN }}
        uses: actions/checkout@v5
        with:
          repository: Ziqing7226/test
          token: ${{ env.EBPLUS_CI_TOKEN }}
          path: firmware-plugin

      - name: Overlay SilkyEvCam HAL plugin into vendored OpenEB
        if: steps.silky.outcome == 'success'
        run: |
          cp firmware-plugin/src/silky_common.cpp      openeb/hal_psee_plugins/src/plugin/
          cp firmware-plugin/src/CMakeLists.plugin.txt openeb/hal_psee_plugins/src/plugin/CMakeLists.txt
          cp firmware-plugin/src/CMakeLists.lib.txt    openeb/hal_psee_plugins/lib/CMakeLists.txt

      - name: Install build dependencies
        run: brew install cmake qtbase qtsvg opencv boost libusb protobuf abseil hdf5 ripgrep

      - name: Build bundle
        run: CREATE_DMG=OFF OPENEB_HDF5_DISABLED=OFF ./scripts/build_macos_app.sh

      - name: Verify packaging configuration
        run: |
          bash tests/macos/test_plugin_loader_config.sh
          bash tests/macos/test_release_bundle_config.sh
          bash tests/macos/test_packaged_bundle.sh

      - name: Upload app artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EBplus-macos-arm64-app
          path: build/dist/EBplus.app
          retention-days: 7

  unit-tests:
    name: Run Apple Silicon tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check out SilkyEvCam HAL plugin sources (optional)
        id: silky
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: Ziqing7226/test
          token: ${{ secrets.EBPLUS_CI_TOKEN }}
          path: firmware-plugin

      - name: Overlay SilkyEvCam HAL plugin into vendored OpenEB
        if: steps.silky.outcome == 'success'
        run: |
          cp firmware-plugin/src/silky_common.cpp      openeb/hal_psee_plugins/src/plugin/
          cp firmware-plugin/src/CMakeLists.plugin.txt openeb/hal_psee_plugins/src/plugin/CMakeLists.txt
          cp firmware-plugin/src/CMakeLists.lib.txt    openeb/hal_psee_plugins/lib/CMakeLists.txt

      - name: Install build and test dependencies
        run: brew install cmake qtbase qtsvg opencv boost libusb protobuf abseil hdf5 googletest ripgrep

      - name: Build vendored OpenEB runtime
        run: CREATE_DMG=OFF OPENEB_HDF5_DISABLED=OFF ./scripts/build_macos_app.sh

      - name: Configure and run CTest
        run: |
          cmake -S . -B build/macos-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGUI_FOR_OPENEB_BUILD_TESTS=ON \
            -DGUI_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/openeb-install;$(brew --prefix)"
          cmake --build build/macos-tests --parallel
          export MV_HAL_PLUGIN_PATH="$GITHUB_WORKSPACE/build/openeb-install/lib/metavision/hal/plugins"
          export DYLD_FALLBACK_LIBRARY_PATH="$GITHUB_WORKSPACE/build/openeb-install/lib:$DYLD_FALLBACK_LIBRARY_PATH"
          ctest --test-dir build/macos-tests --output-on-failure

  package-dmg:
    name: Package Apple Silicon DMG
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check out SilkyEvCam HAL plugin sources (optional)
        id: silky
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: Ziqing7226/test
          token: ${{ secrets.EBPLUS_CI_TOKEN }}
          path: firmware-plugin

      - name: Overlay SilkyEvCam HAL plugin into vendored OpenEB
        if: steps.silky.outcome == 'success'
        run: |
          cp firmware-plugin/src/silky_common.cpp      openeb/hal_psee_plugins/src/plugin/
          cp firmware-plugin/src/CMakeLists.plugin.txt openeb/hal_psee_plugins/src/plugin/CMakeLists.txt
          cp firmware-plugin/src/CMakeLists.lib.txt    openeb/hal_psee_plugins/lib/CMakeLists.txt

      - name: Install build dependencies
        run: brew install cmake qtbase qtsvg opencv boost libusb protobuf abseil hdf5 ripgrep

      - name: Build bundle and DMG
        run: OPENEB_HDF5_DISABLED=OFF ./scripts/build_macos_app.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: EBplus-macos-arm64-dmg
          path: build/dist/*.dmg
          retention-days: 14
